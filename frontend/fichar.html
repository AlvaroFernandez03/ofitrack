<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <div class="container">
    <div class="logo">Ofi<span>Track</span></div>
    <nav>
      <ul>
        <li><a href="fichar.html">Fichar</a></li>
        <li><a href="mi-historial.html">Mi historial</a></li>
        <li><a href="turnos.html">Turnos</a></li>

        <li><a href="perfil.html">Mi perfil</a></li>
      </ul>
    </nav>
    <div class="user-area" id="nav-user-area"></div>
  </div>
</header>

<div class="clock-screen">
  <div id="greeting" class="clock-greeting">Hola</div>
  <div id="today-date" class="clock-date"></div>

  <div class="clock-ring-wrap">
    <!-- El anillo se dibuja con SVG: el círculo "track" es el fondo fijo, y
         "progress" es el que se rellena según las horas hechas. El relleno se
         controla desde JS con stroke-dashoffset. -->
    <svg class="clock-ring" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="track" cx="60" cy="60" r="52"></circle>
      <circle id="ring-progress" class="progress" cx="60" cy="60" r="52"
              stroke-dasharray="326.73" stroke-dashoffset="326.73"></circle>
    </svg>
    <div class="clock-center">
      <div id="live-clock" class="clock-time">--:--</div>
      <div id="clock-status" class="clock-status out">Cargando…</div>
    </div>
  </div>

  <button id="clock-btn" class="clock-btn entrada" disabled>Cargando…</button>

  <div class="clock-summary">
    <div><strong id="hours-today" class="num">0,0</strong><span>Horas hoy</span></div>
    <div><strong id="daily-target" class="num">0</strong><span>Tu jornada</span></div>
    <div><strong id="overtime-today" class="num">0,0</strong><span>Extra</span></div>
  </div>
</div>

<footer>OfiTrack · Proyecto de práctica y portfolio</footer>

<script src="js/auth.js"></script>
<script src="js/fichar.js"></script>
</body>
</html>
